[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[project]
name = "telco"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "polars>=1.9",
    "kaggle>=1.6",
    "requests>=2.31",
    "sqlalchemy>=2.0",
    "python-dotenv>=1.0",
    "psycopg2-binary>=2.9",
]

[dependency-groups]
dev = ["ruff", "ty", "jupyter", "matplotlib>=3.10", "plotly>=6.1.1", "kaleido>=1.0"]